#:schema node_modules/wrangler/config-schema.json
#
# Gad Family Cotton — one Worker serves both the built SPA and the API.
#
# Before the first deploy, create the database and the media bucket and paste
# the ids below (see README → "النشر على Cloudflare"):
#
#   npx wrangler d1 create five-kids-wear
#   npx wrangler r2 bucket create five-kids-wear-media
#
# The Worker, the D1 database and the R2 bucket keep their original names on
# purpose. Renaming any of them does not rename anything — it creates a new,
# empty one and strands the live secrets, orders and product photos on the old.
# The names are internal; nothing here is ever shown to a shopper.
name = "five-kids-wear"
main = "worker/src/index.ts"
compatibility_date = "2026-09-15"

# The free <worker>.<account>.workers.dev URL, retired now that the real domain
# is serving. This has to stay a TOP-LEVEL key: put it after [vars] and TOML
# reads it as an environment variable called "workers_dev" instead, which does
# nothing at all.
workers_dev = false

# The SPA build. Requests that match a file in dist/ are served straight from
# the edge; everything else reaches the Worker, which answers /api/* and /media/*
# and hands any other path back to ASSETS as index.html (client-side routing).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "five-kids-wear"
database_id = "bebd1a59-f48b-41cf-a3d5-dbb835e7dbd1"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "five-kids-wear-media"

[vars]
# Product photos uploaded from the dashboard are served from /media/<key>.
MEDIA_PREFIX = "/media"

# ADMIN_USERNAME and ADMIN_PASSWORD are secrets, never vars — they seed the
# first dashboard account on its first successful login:
#   npx wrangler secret put ADMIN_USERNAME
#   npx wrangler secret put ADMIN_PASSWORD

# ─────────────────────────────────────────────────────────── الدومين ──
# The store answers on gadfamilycotton.com, and on www as well.
#
# `custom_domain = true` makes Cloudflare create the DNS record and issue the
# certificate itself, so there is nothing to add by hand in the DNS tab. A new
# custom domain takes a few minutes to get that certificate, during which it
# refuses connections — that is expected, not a misconfiguration.
[[routes]]
pattern = "gadfamilycotton.com"
custom_domain = true

[[routes]]
pattern = "www.gadfamilycotton.com"
custom_domain = true
